# Mirrors GitHub releases of this ruleset to the Bazel Central Registry:
# on every published release (tag vX.Y.Z) it generates the BCR entry from
# the .bcr/ templates, pushes it to the loseall/bazel-central-registry fork
# and opens a pull request against bazelbuild/bazel-central-registry.
name: Publish to BCR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag of the release to publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@v1.5.0
    with:
      tag_name: ${{ github.event.release.tag_name || inputs.tag_name }}
      registry_fork: loseall/bazel-central-registry
      # Attestation generation requires the release_ruleset release flow;
      # releases here are cut with `gh release create`, so skip it.
      attest: false
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
